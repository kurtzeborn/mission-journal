<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — P-Day Letters</title>
    <!-- Served anonymously, like the home page, so it must not name a
         missionary, a family, or a site. Anyone who lands here arrived by
         following a link they were sent, and the page must not confirm that
         the link points at anything real. -->
    <meta name="description" content="Sign in to a private archive for missionary letters.">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <header class="masthead">
        <div class="masthead__inner">
            <a class="wordmark" href="/">P-Day Letters</a>
            <span class="beta">beta</span>
        </div>
    </header>

    <main class="wrap">
        <h2>Sign in</h2>

        <p class="lede">
            Use the account that matches the email address you were invited with.
        </p>

        <!-- Two providers, and no way to register: an account only reaches an
             archive if the family has already added its address by name. The
             links start out plain so that they still work with no JavaScript;
             login.js only adds the return address. -->
        <p><a class="button" id="signin-aad" href="/.auth/login/aad">Continue with Microsoft</a></p>
        <p><a class="button" id="signin-google" href="/.auth/login/google">Continue with Google</a></p>

        <p class="note">
            Signing in does not request access to your email, contacts, or photos —
            only your name and address, so we can tell which archive is yours.
        </p>
    </main>

    <script src="/login.js"></script>
</body>

</html>
