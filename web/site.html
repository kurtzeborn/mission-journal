<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>P-Day Letters</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <header class="masthead">
        <div class="masthead__inner">
            <a class="wordmark" href="/">P-Day Letters</a>
            <span class="beta">beta</span>
            <span class="masthead__spacer"></span>
            <a class="button button--quiet" href="/.auth/logout">Sign out</a>
        </div>
    </header>

    <main class="wrap">
        <h1 id="site-title" class="post__subject">&nbsp;</h1>

        <form id="search" class="search" role="search" hidden>
            <label class="search__label" for="q">Search these letters</label>
            <input id="q" class="search__input" type="search" name="q" autocomplete="off"
                placeholder="A word, a name, a place&hellip;">
            <p id="search-count" class="note" aria-live="polite"></p>
        </form>

        <div id="state" class="state">Loading letters&hellip;</div>
        <ol id="posts" class="posts"></ol>
    </main>

    <script type="module" src="/app.js"></script>
</body>

</html>
