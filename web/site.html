<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>P-Day Letters</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/brands.min.css">
</head>

<body>
    <header class="masthead">
        <div class="masthead__inner">
            <a class="wordmark" href="/">P-Day Letters</a>
            <span class="beta">beta</span>
            <span class="masthead__spacer"></span>
            <!-- Filled in by app.js from /.auth/me. Plenty of people keep more
                 than one account, and the archive answers for exactly one of
                 them, so say which one rather than making them guess. -->
            <span class="account" id="account" hidden>
                <i class="account__icon" id="account-icon" aria-hidden="true"></i>
                <span class="visually-hidden" id="account-provider"></span>
                <span id="account-email"></span>
            </span>
            <a class="button button--quiet button--compact" id="download" href="#" hidden>Download</a>
            <a class="button button--quiet button--compact" href="/.auth/logout">Sign out</a>
        </div>
    </header>

    <main class="wrap">
        <h1 id="site-title" class="post__subject">&nbsp;</h1>

        <form id="search" class="search" role="search" hidden>
            <label class="search__label" for="q">Search these letters</label>
            <input id="q" class="search__input" type="search" name="q" autocomplete="off"
                placeholder="A word, a name, a place&hellip;">
            <p id="search-count" class="note" aria-live="polite"></p>
        </form>

        <div id="state" class="state">Loading letters&hellip;</div>
        <ol id="posts" class="posts"></ol>
    </main>

    <!--
        Classic scripts, not modules. The same reader has to run from a file://
        URL inside the downloaded zip, where module loading is blocked by CORS.
    -->
    <script src="/vendor/minisearch.js"></script>
    <script src="/reader.js"></script>
    <script src="/app.js"></script>
</body>

</html>
