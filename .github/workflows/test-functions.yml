name: Test functions

# The 49-test suite gated nothing until this existed: the only workflow in the
# repo watched worker/**, so every ingest change shipped unverified by CI.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'tests/fixtures/**'
      - '.github/workflows/test-functions.yml'
  pull_request:
    paths:
      - 'functions/**'
      - 'tests/fixtures/**'
      - '.github/workflows/test-functions.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      # The fixture corpus lives at the repo root, not under functions/, and
      # the tests reach it by relative path — so this must run from a full
      # checkout rather than a sparse one.
      - run: npm test
        working-directory: functions

      # A gate, not a report. `npm audit` alone would be permanently red here:
      # sixteen advisories stand against `mailauth`'s tree, all marked "No fix
      # available", and none reachable — `undici` is never loaded by
      # `mailauth/lib/dkim/verify`, and of `nodemailer` we load one file,
      # `lib/addressparser`, which no advisory touches. A build that fails every
      # time teaches everyone to stop reading it.
      #
      # So this compares advisory IDs against functions/audit-baseline.json and
      # fails only on one nobody has looked at yet. Counting would not do: a
      # count can hold steady while one advisory is fixed and another appears.
      - name: Audit dependencies
        run: npm run audit
        working-directory: functions
